[versions]
# The JDK that compiles and tests the code.
java-toolchain = "25"
# The lowest Java release that the published artifacts support.
java-release = "21"
junit = "6.1.3"
jspecify = "1.0.1"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"
jacoco = "0.8.15"
pitest = "1.30.0"
pitest-junit5 = "1.2.3"
pitest-plugin = "1.19.0"
cyclonedx-plugin = "3.4.1"
dokka = "2.2.0"
jazzer = "0.30.0"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
jackson = "3.2.3"
jmh = "1.37"

[libraries]
# Nullness annotations. Compile-only: not a runtime dependency of the libraries.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# Test libraries.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
# Runtime dependencies of the adapter modules only.
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Benchmarks only (JMH).
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
# Build-time checkers. They are not dependencies of the published artifacts.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Gradle plugins, used by build-logic.
errorprone-gradle-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
pitest-gradle-plugin = { module = "info.solidsoft.pitest:info.solidsoft.pitest.gradle.plugin", version.ref = "pitest-plugin" }
cyclonedx-gradle-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx-plugin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
