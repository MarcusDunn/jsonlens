# Builds, signs, and attests a release from a tag "v<version>", and uploads it to Maven Central.
#
# The environment "release" must have required reviewers, and these secrets and variables:
#   SIGNING_KEY       the ASCII-armored private PGP key for the signatures
#   SIGNING_PASSWORD  the password of that key
#   SIGNING_KEY_ID    (a variable, not a secret) the short ID of the signing subkey: the last 8
#                     hex digits of its fingerprint
#   CENTRAL_TOKEN     base64 of "<user>:<password>" of a Central Portal user token
#
# The upload uses publishingType=USER_MANAGED: the Central Portal checks the bundle, and you
# release it by hand on central.sonatype.com. The upload job has no Gradle and no project code, so
# the code of the build never sees the Central token.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and attest
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signs the attestation with the OIDC identity of this workflow.
      attestations: write # The attestation goes to the attestation store of the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that gradle-wrapper.jar is the official JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check that the tag is the version of the build
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not v${version} from gradle.properties." >&2
            exit 1
          fi
      - name: Check that the published key has the CI signing key, valid for 30 more days
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ vars.SIGNING_KEY_ID }}
          KEY_EMAIL: marcus@marcusdunn.ca
        run: |
          secret_home="$(mktemp -d)"
          public_home="$(mktemp -d)"
          printf '%s\n' "${SIGNING_KEY}" | GNUPGHOME="${secret_home}" gpg --batch --import
          # The fingerprint of the signing key with the ID that Gradle uses.
          fingerprint="$(GNUPGHOME="${secret_home}" gpg --batch --with-colons --list-secret-keys \
            | awk -F: -v id="${SIGNING_KEY_ID}" '$1 == "fpr" && toupper($10) ~ toupper(id) "$" { print $10; exit }')"
          GNUPGHOME="${secret_home}" gpgconf --kill all
          rm -rf "${secret_home}"
          if [ -z "${fingerprint}" ]; then
            echo "The secret SIGNING_KEY has no key with the ID ${SIGNING_KEY_ID}." >&2
            exit 1
          fi
          GNUPGHOME="${public_home}" gpg --batch --auto-key-locate clear,wkd,nodefault --locate-external-keys "${KEY_EMAIL}"
          days="$(GNUPGHOME="${public_home}" .github/scripts/signing-key-days.sh "${KEY_EMAIL}" "${fingerprint}")"
          if [ "${days}" != never ] && [ "${days}" -lt 30 ]; then
            echo "The signing key ${fingerprint} expires in ${days} days. Extend it first." >&2
            exit 1
          fi
          echo "The signing key ${fingerprint} is valid for ${days} more days."
      - name: Check, build, sign, and bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ vars.SIGNING_KEY_ID }}
        run: nix develop --command ./gradlew --no-build-cache --no-configuration-cache check centralBundle
      - name: Attest the build provenance (SLSA, signed with Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/**/*.jar
            build/staging-deploy/**/*.pom
            build/staging-deploy/**/*-cyclonedx.json
            build/central-bundle.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-bundle
          path: build/central-bundle.zip
          if-no-files-found: error

  upload:
    name: Upload to Maven Central
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-bundle
      - name: Upload the bundle to the Central Portal
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CENTRAL_TOKEN}" \
            --form bundle=@central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=jsonlens-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
